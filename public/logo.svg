<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Geometric Architectural Emblem Icon -->
  <g id="emblem" transform="translate(100, 20)" filter="url(#shadow)">
    <!-- Central Tower Pinnacle -->
    <path d="M150 10 L195 65 L175 65 L175 290 L125 290 L125 65 L105 65 Z" fill="url(#goldGrad)" stroke="#AA7C11" stroke-width="2"/>
    
    <!-- Central Tower Inner Arch / Vault -->
    <path d="M135 290 L135 220 C135 200 165 200 165 220 L165 290 Z" fill="#0b192c" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M143 290 L143 240 C143 230 157 230 157 240 L157 290 Z" fill="url(#emeraldGrad)"/>

    <!-- Left Tower Tier 1 -->
    <path d="M100 80 L120 105 L105 105 L105 290 L75 290 L75 105 L60 105 Z" fill="url(#emeraldGrad)" stroke="#047857" stroke-width="2"/>
    <!-- Left Tower Tier 2 -->
    <path d="M55 130 L72 150 L60 150 L60 290 L30 290 L30 150 L18 150 Z" fill="url(#goldGrad)" stroke="#AA7C11" stroke-width="2"/>
    <!-- Left Base Wing -->
    <path d="M15 185 L28 200 L18 200 L18 290 L-5 290 L-5 200 L-15 200 Z" fill="url(#emeraldGrad)"/>

    <!-- Right Tower Tier 1 -->
    <path d="M200 80 L240 105 L225 105 L225 290 L195 290 L195 105 L180 105 Z" fill="url(#emeraldGrad)" stroke="#047857" stroke-width="2"/>
    <!-- Right Tower Tier 2 -->
    <path d="M245 130 L282 150 L270 150 L270 290 L240 290 L240 150 L228 150 Z" fill="url(#goldGrad)" stroke="#AA7C11" stroke-width="2"/>
    <!-- Right Base Wing -->
    <path d="M285 185 L315 200 L305 200 L305 290 L282 290 L282 200 L272 200 Z" fill="url(#emeraldGrad)"/>

    <!-- Base Horizon Bar -->
    <rect x="-15" y="295" width="330" height="12" rx="4" fill="url(#goldGrad)"/>
    <!-- Foundation Stepping Lines -->
    <line x1="10" y1="316" x2="290" y2="316" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Arabic Calligraphy / Text -->
  <g transform="translate(250, 365)" text-anchor="middle">
    <text font-family="'Cairo', 'Tajawal', sans-serif" font-size="27" font-weight="900" fill="#ffffff" letter-spacing="1">
      مؤسسة الأفكار المتفردة للمقاولات
    </text>
  </g>
  
  <!-- Subtitle Text -->
  <g transform="translate(250, 400)" text-anchor="middle">
    <text font-family="'Outfit', 'Inter', sans-serif" font-size="16" font-weight="700" fill="#22c55e" letter-spacing="2">
      AL-AFKAR AL-MUTAFAREDAH EST.
    </text>
    <text y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="1">
      POWER INFRASTRUCTURE &amp; CIVIL CONTRACTING • C.R: 7033475166
    </text>
  </g>
</svg>
